[platformio]
default_envs = blackbox-cardputer-adv

[env:blackbox-cardputer-adv]
platform = espressif32@6.10.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.partitions = ../custom_8Mb.csv
board_upload.flash_size = 8MB
board_upload.maximum_size = 5111808
build_src_filter = -<*> +<main.cpp> +<registry.cpp> +<navigation.cpp> +<input.cpp> +<status.cpp> +<display.cpp>
lib_deps =
    bodmer/TFT_eSPI@2.5.43
    adafruit/Adafruit TCA8418@1.0.2
    adafruit/Adafruit BusIO@1.17.2
build_flags =
    -DUSER_SETUP_LOADED
    -DST7789_2_DRIVER
    -DTFT_RGB_ORDER=1
    -DUSE_HSPI_PORT
    -DTFT_WIDTH=135
    -DTFT_HEIGHT=240
    -DCGRAM_OFFSET
    -DTFT_MOSI=35
    -DTFT_SCLK=36
    -DTFT_CS=37
    -DTFT_DC=34
    -DTFT_RST=33
    -DTFT_MISO=-1
    -DSPI_FREQUENCY=20000000
    -DLOAD_GLCD
    -DLOAD_FONT2
    -DTOUCH_CS=-1
lib_ignore =
    Adafruit SH110X
    Adafruit GFX Library
